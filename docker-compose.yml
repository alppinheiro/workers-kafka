services:
  postgres:
    image: postgres:16-alpine
    container_name: workers-kafka-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: saga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saga-data:/var/lib/postgresql/data

  migrations:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://saga:saga@postgres:5432/saga?sslmode=disable
      - up
    restart: "no"

  postgres-read:
    image: postgres:16-alpine
    container_name: workers-kafka-postgres-read
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: saga_read
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga_read"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saga-read-data:/var/lib/postgresql/data

  migrations-read:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres-read:
        condition: service_healthy
    volumes:
      - ./migrations-read:/migrations
    command:
      - -path=/migrations
      - -database=postgres://saga:saga@postgres-read:5432/saga_read?sslmode=disable
      - up
    restart: "no"

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: workers-kafka-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  kafka:
    image: apache/kafka:3.9.0
    container_name: workers-kafka-broker
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "L-j4cHiMTD6gNiFkZAfo0g"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.payment --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.inventory --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.notification --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.status --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic orders.created --partitions 4 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic orders.payment --partitions 4 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic orders.inventory --partitions 4 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic orders.notification --partitions 4 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --alter --topic orders.status --partitions 4 || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.payment.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.inventory.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.notification.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.status.dlq --partitions 1 --replication-factor 1
    restart: "no"

  orchestrator:
    build:
      context: .
      args:
        TARGET: cmd/orchestrator
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga?sslmode=disable
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully

  worker-payment:
    build:
      context: .
      args:
        TARGET: cmd/worker-payment
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga?sslmode=disable
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully

  worker-inventory:
    build:
      context: .
      args:
        TARGET: cmd/worker-inventory
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga?sslmode=disable
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully

  worker-notification:
    build:
      context: .
      args:
        TARGET: cmd/worker-notification
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga?sslmode=disable
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully

  projector:
    build:
      context: .
      args:
        TARGET: cmd/projector
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
      DATABASE_URL: postgres://saga:saga@postgres-read:5432/saga_read?sslmode=disable
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations-read:
        condition: service_completed_successfully

  outbox-relay:
    build:
      context: .
      args:
        TARGET: cmd/outbox-relay
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga?sslmode=disable
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully

  metrics-exporter:
    build:
      context: .
      args:
        TARGET: cmd/metrics-exporter
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga?sslmode=disable
    depends_on:
      migrations:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: workers-kafka-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:11.2.0
    container_name: workers-kafka-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  order-status:
    build:
      context: .
      args:
        TARGET: cmd/order-status
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  create-order:
    build:
      context: .
      args:
        TARGET: cmd/create-order
    environment:
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4318
      SAGA_WORKERS: ${SAGA_WORKERS:-1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles:
      - tools

volumes:
  saga-data:
  saga-read-data:
