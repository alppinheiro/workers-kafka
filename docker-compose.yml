services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: workers-kafka-broker
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "L-j4cHiMTD6gNiFkZAfo0g"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.payment --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.inventory --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.notification --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.status --partitions 1 --replication-factor 1
    restart: "no"

  orchestrator:
    build:
      context: .
      args:
        TARGET: cmd/orchestrator
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  worker-payment:
    build:
      context: .
      args:
        TARGET: cmd/worker-payment
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  worker-inventory:
    build:
      context: .
      args:
        TARGET: cmd/worker-inventory
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  worker-notification:
    build:
      context: .
      args:
        TARGET: cmd/worker-notification
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  order-status:
    build:
      context: .
      args:
        TARGET: cmd/order-status
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  create-order:
    build:
      context: .
      args:
        TARGET: cmd/create-order
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles:
      - tools