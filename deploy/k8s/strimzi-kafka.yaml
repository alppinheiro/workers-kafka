# Kafka via Strimzi (Fase 9) - cluster KRaft single-node + tópicos (IaC).
# Requer o operador Strimzi instalado (helm install strimzi-operator strimzi/strimzi-kafka-operator).
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: order-saga-kafka
  namespace: order-saga
spec:
  kafka:
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: "false"
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    storage:
      type: persistent-claim
      size: 2Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# Tópicos principais (4 partições - correlação por order_id)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders.created
  namespace: order-saga
  labels:
    strimzi.io/cluster: order-saga-kafka
spec:
  partitions: 4
  replicas: 1
---
