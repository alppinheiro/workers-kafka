# Kafka KRaft single-node (Fase 9) - mesma imagem/config do docker-compose local.
# Fallback simplificado do Strimzi/bitnami (o ambiente local nao acessa quay.io
# e o bitnami nao publica mais no Docker Hub). Tópicos criados pelo Job kafka-init.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-saga-kafka-pvc
  namespace: order-saga
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: order-saga
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: order-saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: order-saga
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.order-saga.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: CLUSTER_ID
              value: "L-j4cHiMTD6gNiFkZAfo0g"
          volumeMounts:
            - name: data
              mountPath: /tmp/kraft-combined-logs
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: order-saga-kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: order-saga
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
# Cria os tópicos do pipeline (4 partições; DLQ com 1) - mesmo papel do kafka-init do compose.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: order-saga
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "aguardando kafka..."; sleep 5;
              done
      containers:
        - name: create-topics
          image: apache/kafka:3.9.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for t in orders.created orders.payment orders.inventory orders.notification orders.status; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$t" --partitions 4 --replication-factor 1
              done
              for t in orders.created.dlq orders.payment.dlq orders.inventory.dlq orders.notification.dlq orders.status.dlq; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1
              done
              echo "tópicos criados"
