# Prometheus scrape config PARA O AMBIENTE KIND (deploy/k8s/observability.yaml).
# Targets = Services ClusterIP da aplicação no namespace order-saga (9101-9107),
# mesmas métricas expostas no docker-compose — os dashboards são multi-ambiente.
# As regras vêm do repositório (prometheus/rules.yml) — mantém a fonte única.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ["order-saga-orchestrator:9101"]
  - job_name: worker-payment
    static_configs:
      - targets: ["order-saga-worker-payment:9102"]
  - job_name: worker-inventory
    static_configs:
      - targets: ["order-saga-worker-inventory:9103"]
  - job_name: worker-notification
    static_configs:
      - targets: ["order-saga-worker-notification:9104"]
  - job_name: projector
    static_configs:
      - targets: ["order-saga-projector:9105"]
  - job_name: outbox-relay
    static_configs:
      - targets: ["order-saga-outbox-relay:9106"]
  - job_name: metrics-exporter
    static_configs:
      - targets: ["order-saga-metrics-exporter:9107"]
  # kube-state-metrics: réplicas/HPA dos Deployments (dashboards de escala no kind).
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["order-saga-kube-state-metrics:8080"]
