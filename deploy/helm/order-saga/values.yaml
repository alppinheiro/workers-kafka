# Valores do chart order-saga (Fase 9 - Kubernetes local / kind).
# Imagens: publicadas pelo CI (Fase 8) em ghcr.io/alppinheiro/workers-kafka-<svc>.

namespace: order-saga

image:
  repository: ghcr.io/alppinheiro
  pullPolicy: IfNotPresent
  # tag: latest (por padrão usa a tag do values; sobrescreva em valores-prod por versão)
  tag: latest

replicaCount: 1

# Replicas dedicadas do outbox-relay (o gargalo de ingestão do Kafka no stress de 120k:
# ~500 ev/s com 1 réplica; com N réplicas o SKIP LOCKED drena em paralelo sem duplicação).
relayReplicas: 2

# Tamanho do lote do outbox-relay (claim→publish→mark por ciclo). Default do código: 500.
outboxBatchSize: 2000

# Durabilidade do producer (all = leader + ISR; one = só leader, maior throughput).
kafkaAcks: "all"

# Amostragem de traces (spec OTel). Em produção: parentbased_traceidratio + ARG=0.1.
otelTracesSampler: "parentbased_always_on"
# otelTracesSamplerArg: "0.1"

# Circuit breaker dos gateways (fail-fast quando um gateway degrada).
gatewayCircuitBreaker:
  enabled: true
  maxFailures: 5
  timeout: "10s"

resources:
  requests:
    cpu: "50m"
    memory: "32Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"

kafka:
  # FQDN do Service (funciona de qualquer namespace - inclusive o do KEDA)
  brokers: "kafka.order-saga.svc.cluster.local:9092"

postgres:
  writeUrl: "postgres://saga:saga@order-saga-postgres:5432/saga?sslmode=disable"
  readUrl: "postgres://saga:saga@order-saga-postgres-read:5432/saga_read?sslmode=disable"

otel:
  # Sem collector no cluster ainda (9.7). Com WithInsecure(), o endpoint é host:port
  # (sem scheme) — evita o erro de parse do exporter OTLP.
  endpoint: "order-saga-otel:4318"

sagaWorkers: 1

keda:
  lagThreshold: 200
  minReplicas: 1
  maxReplicas: 3

# Serviços da aplicação. db: write/read/none controla a DATABASE_URL injetada.
# metricsPort é a porta do server /metrics + /healthz (probes). keda liga o ScaledObject.
services:
  - name: orchestrator
    image: workers-kafka-orchestrator
    metricsPort: 9101
    db: write
    keda:
      consumerGroup: orchestrator
      topic: orders.created
  - name: worker-payment
    image: workers-kafka-worker-payment
    metricsPort: 9102
    db: write
    keda:
      consumerGroup: worker-payment
      topic: orders.payment.cmd
  - name: worker-inventory
    image: workers-kafka-worker-inventory
    metricsPort: 9103
    db: write
    keda:
      consumerGroup: worker-inventory
      topic: orders.inventory.cmd
  - name: worker-notification
    image: workers-kafka-worker-notification
    metricsPort: 9104
    db: write
    keda:
      consumerGroup: worker-notification
      topic: orders.notification.cmd
  - name: order-status
    image: workers-kafka-order-status
    db: none
  - name: outbox-relay
    image: workers-kafka-outbox-relay
    metricsPort: 9106
    db: write
  - name: projector
    image: workers-kafka-projector
    metricsPort: 9105
    db: read
  - name: metrics-exporter
    image: workers-kafka-metrics-exporter
    metricsPort: 9107
    db: write
