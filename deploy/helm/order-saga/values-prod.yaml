# Valores de PRODUÇÃO (Fase 10 - EKS). Aplicados via Helm/ArgoCD (values-prod.yaml).
# Estratégia GitOps: endpoints de infra que mudam a cada apply (RDS) NÃO ficam
# hardcoded aqui — são injetados via Secret no cluster (ver docs/AWS_SESSION_REPORT.md).
# Este arquivo é versionado; segredos nunca entram no git.

namespace: order-saga

image:
  repository: ghcr.io/alppinheiro
  pullPolicy: IfNotPresent
  # latest = CI publica na main; ArgoCD auto-sync pega a imagem mais recente.
  tag: latest

replicaCount: 2

# Fase 10/EKS: relay com réplicas dedicadas (gargalo de ingestão) + lote maior.
relayReplicas: 2
outboxBatchSize: 2000
kafkaAcks: "all"
otelTracesSampler: "parentbased_traceidratio"
otelTracesSamplerArg: "0.1"
gatewayCircuitBreaker:
  enabled: true
  maxFailures: 5
  timeout: "10s"

resources:
  requests:
    cpu: "50m"
    memory: "32Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"

kafka:
  # Kafka KRaft single-node (deploy/k8s/kafka.yaml, Fase 9) — service `kafka`.
  # Alternativa Strimzi: order-saga-kafka-kafka-bootstrap.<ns>.svc.cluster.local:9092
  brokers: "kafka.order-saga.svc.cluster.local:9092"

# DATABASE_URL / DATABASE_URL_READ são preenchidos pelo Secret `order-saga-secrets`
# criado no cluster (kubectl apply) após o terraform apply — NUNCA no git.
postgres:
  writeUrl: "CHANGE_ME_VIA_SECRET"
  readUrl: "CHANGE_ME_VIA_SECRET"

otel:
  # Collector/observabilidade no cluster (10.5); sem scheme (WithInsecure no exporter).
  endpoint: "opentelemetry-collector.observability.svc.cluster.local:4318"

sagaWorkers: 1

keda:
  lagThreshold: 200
  minReplicas: 1
  maxReplicas: 3

