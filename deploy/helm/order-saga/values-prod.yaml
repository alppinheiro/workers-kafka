# Valores de PRODUÇÃO (Fase 10 - EKS). Aplicados via Helm/ArgoCD (values-prod.yaml).
# Endpoints cloud: ajustar conforme o output do Terraform / Kafka do cluster.

namespace: order-saga

image:
  repository: ghcr.io/alppinheiro
  pullPolicy: IfNotPresent
  # tag: v0.1.0  # trocar pela versão real (criar tag semver no CI) — ver PHASE_10 §10.3
  tag: latest

replicaCount: 1

# Fase 10/EKS: relay com réplicas dedicadas (gargalo de ingestão) + lote maior.
relayReplicas: 2
outboxBatchSize: 2000
kafkaAcks: "all"
otelTracesSampler: "parentbased_traceidratio"
otelTracesSamplerArg: "0.1"
gatewayCircuitBreaker:
  enabled: true
  maxFailures: 5
  timeout: "10s"

resources:
  requests:
    cpu: "50m"
    memory: "32Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"

kafka:
  # Strimzi no EKS (recomendado) OU MSK. Ajustar ao endpoint real:
  #   Strimzi: <cluster>-kafka-bootstrap.<ns>.svc.cluster.local:9092
  #   MSK:     b-1.<cluster>.<az>.kafka.<region>.amazonaws.com:9092
  brokers: "order-saga-kafka-kafka-bootstrap.order-saga.svc.cluster.local:9092"

postgres:
  # RDS (endpoint do output `rds_endpoint`). Credenciais via Secret (kubectl/ExternalSecret)
  # — os valores abaixo são placeholder, NÃO commitar senha real.
  writeUrl: "postgres://saga:CHANGE_ME@order-saga-db.REGION.rds.amazonaws.com:5432/saga?sslmode=require"
  readUrl: "postgres://saga:CHANGE_ME@order-saga-db.REGION.rds.amazonaws.com:5432/saga_read?sslmode=require"

otel:
  # Collector/observabilidade no cluster (10.5); sem scheme (WithInsecure no exporter).
  endpoint: "opentelemetry-collector.observability.svc.cluster.local:4318"

sagaWorkers: 1

keda:
  lagThreshold: 200
  minReplicas: 1
  maxReplicas: 3
