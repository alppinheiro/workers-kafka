global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:9101"]
  - job_name: worker-payment
    static_configs:
      - targets: ["worker-payment:9102"]
  - job_name: worker-inventory
    static_configs:
      - targets: ["worker-inventory:9103"]
  - job_name: worker-notification
    static_configs:
      - targets: ["worker-notification:9104"]
  - job_name: projector
    static_configs:
      - targets: ["projector:9105"]
  - job_name: outbox-relay
    static_configs:
      - targets: ["outbox-relay:9106"]
  - job_name: metrics-exporter
    static_configs:
      - targets: ["metrics-exporter:9107"]
